services:
  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: always
    container_name: yeahwhat2eat-qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335

    healthcheck:
      # 镜像默认 shell 为 dash，不支持 /dev/tcp，必须显式用 bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

configs:
  qdrant_config:
    content: |
      log_level: INFO