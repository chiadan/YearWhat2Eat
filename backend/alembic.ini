# alembic configuration for YeahWhat2Eat
# NOTE: keep this file pure ASCII (no non-ASCII comments) so that
# alembic's locale-encoded config read works on any platform (GBK on Windows).

[alembic]
# migration scripts dir (resolved relative to backend/ by env.py)
script_location = app/db/migrations
# URL is injected at runtime by env.py from app.core.config (SQLITE_PATH)
sqlalchemy.url = sqlite:///./data/yeahwhat2eat.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
