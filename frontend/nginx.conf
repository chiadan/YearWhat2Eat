# 「是啊吃什么」前端 nginx（§12.4）：托管 dist + 反代 /api 与 /static
# SSE 流式必须关闭缓冲（proxy_buffering off，§9.1 / §12.4）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端（SSE 关缓冲）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 菜谱成品图等静态资源（§12.5 部署注意 5）
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Vue history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
